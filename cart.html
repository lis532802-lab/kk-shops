<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - KK Shop</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">KK <span>Shop</span></a>
      <div class="nav-actions" id="nav-user-actions"></div>
    </div>
  </header>

  <main class="main-container">
    <h2 class="section-title" style="margin-bottom: 1.5rem;">Shopping Cart</h2>
    <div id="cart-wrapper" style="display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
      <div id="cart-items-list" style="display: flex; flex-direction: column; gap: 1rem;"></div>
      
      <div style="background: white; border: 1px solid var(--border); padding: 1.5rem; border-radius: 12px; height: fit-content;">
        <h3 style="margin-bottom: 1rem; font-size: 1.2rem;">Order Summary</h3>
        <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; color: #4B5563;">
          <span>Subtotal</span>
          <span id="cart-subtotal">$0.00</span>
        </div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 1rem; color: #4B5563;">
          <span>Shipping</span>
          <span>Free</span>
        </div>
        <hr style="border: none; border-top: 1px solid var(--border); margin: 1rem 0;">
        <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 1.2rem; margin-bottom: 1.5rem;">
          <span>Total</span>
          <span id="cart-total">$0.00</span>
        </div>
        <a href="checkout.html" id="checkout-btn" class="btn btn-primary" style="width: 100%;">Proceed to Checkout</a>
      </div>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/cart.js"></script>
</body>
</html>
