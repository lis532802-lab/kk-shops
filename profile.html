<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - KK Shop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">KK <span>Shop</span></a>
      <div class="nav-actions" id="nav-user-actions"></div>
    </div>
  </header>

  <main class="main-container">
    <div style="max-width: 600px; margin: 0 auto; background: white; border: 1px solid var(--border); border-radius: 16px; padding: 2rem;">
      <h2 class="section-title" style="margin-bottom: 1.5rem;">User Profile</h2>
      <div style="margin-bottom: 1.5rem;">
        <label class="form-label">Full Name</label>
        <p id="profile-name" style="font-size: 1.1rem; font-weight: 700;">Loading...</p>
      </div>
      <div style="margin-bottom: 1.5rem;">
        <label class="form-label">Email Address</label>
        <p id="profile-email" style="font-size: 1.1rem; color: #4B5563;">Loading...</p>
      </div>
      <div style="display: flex; gap: 1rem; margin-top: 2rem;">
        <a href="orders.html" class="btn btn-outline" style="flex: 1;">View My Orders</a>
        <button id="logout-btn" class="btn btn-primary" style="flex: 1; background: #EF4444;">Sign Out</button>
      </div>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
  <script type="module">
    import { subscribeAuthState, logoutUser } from "./firebase/auth.js";

    subscribeAuthState((user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      document.getElementById('profile-name').textContent = user.displayName || "User";
      document.getElementById('profile-email').textContent = user.email;
    });

    document.getElementById('logout-btn')?.addEventListener('click', async () => {
      await logoutUser();
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
