<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KK Shop - Premium E-Commerce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">KK <span>Shop</span></a>
      <div class="search-bar-container">
        <svg class="search-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="live-search" class="search-input" placeholder="Search products, brands, categories...">
      </div>
      <div class="nav-actions" id="nav-user-actions">
        <!-- Dynamic User Status Hydrated by app.js -->
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-card">
      <div class="hero-content">
        <span class="hero-tag">New Collection 2025</span>
        <h1 class="hero-title">Experience Premium Quality</h1>
        <p class="hero-subtitle">Discover top-tier tech, fashion, and lifestyle curated items.</p>
        <a href="#catalog" class="btn btn-primary">Shop Catalog</a>
      </div>
    </div>
  </section>

  <!-- Main Catalog Area -->
  <main class="main-container" id="catalog">
    <div class="section-header">
      <h2 class="section-title">All Products</h2>
    </div>

    <!-- Dynamic Product Grid -->
    <div class="product-grid" id="product-grid-container">
      <!-- Skeletons rendered initially -->
      <div class="product-card" style="height:320px;"><div class="skeleton" style="height:100%;"></div></div>
      <div class="product-card" style="height:320px;"><div class="skeleton" style="height:100%;"></div></div>
      <div class="product-card" style="height:320px;"><div class="skeleton" style="height:100%;"></div></div>
      <div class="product-card" style="height:320px;"><div class="skeleton" style="height:100%;"></div></div>
    </div>
  </main>

  <footer>
    <div class="footer-content">
      <p>&copy; 2025 KK Shop. All rights reserved.</p>
      <p>Direct Telegram Contact: @DEVBRONX</p>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/products.js"></script>
</body>
</html>
